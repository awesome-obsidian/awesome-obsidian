configuration:
  markdown_header_file: "config/header.md"
  markdown_footer_file: "config/footer.md"
  extension_script: "config/extension.py"
  min_description_length: 0
  max_description_length: 1000  # don't truncate descriptions
  min_stars: 0
  min_projectrank: 0
  require_homepage: false
  require_license: false
  require_repo: false
  allowed_licenses: ["all"]
  project_inactive_months: 12
  project_dead_months: 9999

categories:
- category: plugins
  title: 🔌 Plugins
  subtitle: "Community plugins that extend Obsidian with new features, tools, and capabilities (TBA) [For now use the official Obsidian Community (https://community.obsidian.md/search?type=plugin)]"
- category: themes
  title: 🎨 Themes
  subtitle: "Themes and visual styles for customizing the look and feel of Obsidian (TBA) [For now use the official Obsidian Community (https://community.obsidian.md/search?type=theme)]"
- category: css
  title: 🌈 CSS Snippets
  subtitle: "Custom CSS snippets for modifying and enhancing the Obsidian interface"
- category: assets
  title: 🖼️ Assets
  subtitle: "Icons, banners, fonts, images, and other visual resources for Obsidian"
- category: templates
  title: 💡 Templates
  subtitle: "Ready-to-use templates for notes, projects, meetings, study, and everyday workflows"
- category: dataview
  title: 📊 Dataview
  subtitle: "Queries, DataviewJS scripts, dashboards, tables, and dynamic views for your vault"
- category: vaults
  title: 🏠 Vaults
  subtitle: "Complete vaults, vault structures, and setups for inspiration and reuse"
- category: workflows
  title: 🔄 Workflows
  subtitle: "Practical workflows, productivity systems, and methods for getting more out of Obsidian"
- category: integrations
  title: 🔗 Integrations
  subtitle: "Connections between Obsidian and external apps, services, and platforms"
- category: tools
  title: 🛠️ Tools
  subtitle: "Tools and utilities for capturing, managing, automating, converting, and working with Obsidian vaults"
- category: ssg
  title: 🌐 Static-Site Generators
  subtitle: "Tools for publishing Obsidian vaults and Markdown content as websites"
- category: related
  title: 🖇️ Related
  subtitle: "Related projects, ecosystems and resources connected to Obsidian"

labels:
- label: official
  image: https://cdn.simpleicons.org/obsidian
  url: https://obsidian.md
  description: Built and maintained directly by the Obsidian team

